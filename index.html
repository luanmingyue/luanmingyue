<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minyue Luan | Bento-Grid Portfolio</title>
    <style>
        /* --- 极简暗黑与未来主义规范 --- */
        :root {
            --bg-main: #060608;
            --bg-card: rgba(18, 18, 22, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(58, 134, 255, 0.4);
            --text-primary: #f8f9fa;
            --text-secondary: #8e8e93;
            --accent: #3a86ff;
            --accent-glow: rgba(58, 134, 255, 0.15);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 背景动态粒子画布 --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* --- 1. 引导页层 --- */
        #intro-page {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 1s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .intro-title {
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .intro-btn {
            padding: 10px 24px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #fff;
            letter-spacing: 0.15em;
            font-size: 0.8rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        #intro-page:hover .intro-btn {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* --- 2. 主站框架 --- */
        #main-site { display: block; opacity: 1; }

        header {
            width: 100%; padding: 25px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 999;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .logo { font-weight: 700; letter-spacing: 0.05em; font-size: 1.1rem; }
        nav a { margin-left: 30px; font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; transition: 0.3s; }
        nav a:hover { color: var(--text-primary); }

        /* Hero 区块 */
        .hero {
            height: 90vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 0 5%; position: relative;
            padding-top: 80px;
        }
        .hero-tag {
            font-size: 0.8rem; color: var(--accent);
            letter-spacing: 0.2em; text-transform: uppercase;
            margin-bottom: 20px; padding: 4px 12px;
            background: rgba(58, 134, 255, 0.07);
            border: 1px solid rgba(58, 134, 255, 0.15);
            border-radius: 12px;
        }
        .hero h1 { font-size: 3.8rem; font-weight: 300; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 25px; }
        .hero h1 span { font-weight: 700; background: linear-gradient(135deg, #fff 30%, #666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.05rem; color: var(--text-secondary); max-width: 620px; margin-bottom: 40px; font-weight: 300; }

        /* --- 参考图无缝跑马灯流 --- */
        .marquee-container {
            width: 100%; overflow: hidden; position: relative;
            padding: 20px 0; background: rgba(255,255,255,0.01);
            border-top: 1px solid rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 100px;
        }
        .marquee-wrapper { display: flex; width: 200%; animation: marquee 25s linear infinite; }
        .marquee-wrapper:hover { animation-play-state: paused; }
        .marquee-item {
            width: 280px; height: 160px; margin: 0 10px;
            background: #111115; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 20px; border: 1px solid var(--border-color);
            position: relative; overflow: hidden; flex-shrink: 0;
        }
        .marquee-item::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 60%); z-index: 1;
        }
        .marquee-item span { position: relative; z-index: 2; font-size: 0.8rem; color: var(--accent); font-weight: 600; }
        .marquee-item h5 { position: relative; z-index: 2; font-size: 1rem; font-weight: 400; margin-top: 4px; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

        /* --- Bento Grid（便当流网格主体） --- */
        .grid-section { padding: 60px 8%; max-width: 1400px; margin: 0 auto; }
        .section-header { margin-bottom: 40px; }
        .section-header h2 { font-size: 1.8rem; font-weight: 400; letter-spacing: -0.01em; }
        .section-header p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 160px;
            gap: 24px;
        }

        /* 卡片基础玻璃态样式 */
        .bento-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .bento-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(58, 134, 255, 0.05);
            transform: translateY(-2px);
        }

        /* 空间定位跨度调整 */
        .w-2 { grid-column: span 2; }
        .w-3 { grid-column: span 3; }
        .w-4 { grid-column: span 4; }
        .h-2 { grid-row: span 2; }
        .h-3 { grid-row: span 3; }

        /* 卡片内部元素细化 */
        .card-tag { font-size: 0.75rem; color: var(--accent); letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase; }
        .card-title { font-size: 1.3rem; font-weight: 500; margin-top: 10px; margin-bottom: 12px; }
        .card-desc { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; font-weight: 300; }
        
        /* 大数字、硬指标展示样式 */
        .big-stat { font-size: 3.5rem; font-weight: 200; line-height: 1; color: var(--text-primary); margin-top: 15px; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }

        /* 特殊修饰元素 */
        .card-icon { position: absolute; right: 25px; top: 25px; font-size: 1.5rem; alpha: 0.3; color: rgba(255,255,255,0.05); }
        .glow-effect {
            position: absolute; width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(58,134,255,0.15) 0%, transparent 70%);
            top: -50px; right: -50px; pointer-events: none;
        }

        /* 列表式排列 */
        .tech-list { margin-top: 15px; }
        .tech-list p { font-size: 0.9rem; margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.05); padding-bottom: 4px;}
        .tech-list span { color: var(--text-secondary); }

        /* --- Footer 联系模块 --- */
        footer {
            background: #09090b; padding: 100px 8% 50px 8%;
            border-top: 1px solid rgba(255,255,255,0.03); margin-top: 120px;
        }
        .footer-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-start; }
        .footer-left h3 { font-size: 2rem; font-weight: 300; margin-bottom: 15px; }
        .footer-right { text-align: right; }
        .footer-email { font-size: 1.5rem; color: var(--text-primary); text-decoration: none; font-weight: 300; transition: 0.3s; }
        .footer-email:hover { color: var(--accent); }
        .footer-bottom { max-width: 1200px; margin: 60px auto 0 auto; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.03); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); }

        /* --- 3. 彻底响应式设计体系 (Mobile adaptation) --- */
        @media (max-width: 1100px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; }
            .w-3, .w-4 { grid-column: span 2; }
            .h-3 { grid-row: span 2; }
        }
        @media (max-width: 768px) {
            header nav { display: none; }
            .hero h1 { font-size: 2.3rem; }
            .bento-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
            .w-2, .w-3, .w-4 { grid-column: span 1; }
            .h-2, .h-3 { grid-row: span 1; }
